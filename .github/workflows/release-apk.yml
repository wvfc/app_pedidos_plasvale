name: Publicar APK em Release

# Dispare criando uma tag (ex.: git tag v1.0.0 && git push origin v1.0.0)
# ou manualmente pela aba Actions, informando o nome da versão.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Nome da versão (ex.: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Compilar e anexar o APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Definir o nome da versão
        id: versao
        run: echo "nome=${{ github.event.inputs.versao || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Compilar o APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o APK
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk \
             "entrega/pedidos-plasvale-${{ steps.versao.outputs.nome }}.apk"

      - name: Criar a Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.nome }}
          name: Pedidos Plasvale ${{ steps.versao.outputs.nome }}
          body: |
            APK de instalação direta (build de debug, assinado com a chave de depuração do Android).

            Para instalar: baixe o arquivo `.apk` no celular e autorize
            "Instalar apps de fontes desconhecidas" no navegador/gerenciador de arquivos.
          files: entrega/*.apk
          fail_on_unmatched_files: true
